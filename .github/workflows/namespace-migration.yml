name: One-shot Helve namespace sweep

on:
  push:
    branches:
      - namespace/helve

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'JamieLittle16/Helve' && github.ref == 'refs/heads/namespace/helve'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout namespace branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: namespace/helve
          fetch-depth: 0
          persist-credentials: true

      - name: Rewrite active namespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('crates'), Path('tools'), Path('.github/workflows')]
          suffixes = {
              '.rs', '.toml', '.py', '.sh', '.yml', '.yaml', '.json', '.txt', '.md'
          }
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  if path == Path('.github/workflows/namespace-migration.yml'):
                      continue
                  try:
                      original = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  migrated = (
                      original
                      .replace('crucible_', 'helve_')
                      .replace('crucible-', 'helve-')
                      .replace('CRUCIBLE_BENCH_CPU', 'HELVE_BENCH_CPU')
                  )
                  if migrated != original:
                      path.write_text(migrated, encoding='utf-8')
                      changed.append(str(path))
          print(f'migrated {len(changed)} active files')
          for path in changed:
              print(path)
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/namespace-migration.yml
          git config user.name 'Jamie Little'
          git config user.email '160879046+JamieLittle16@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'helve: migrate active Rust and tooling identifiers'
          git push origin HEAD:namespace/helve
