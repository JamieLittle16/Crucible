name: Section Target Combined Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/section-target-combined-smoke.yml"
      - "tools/section_target_combined.py"
      - "tools/section_target_hardware.py"
      - "tools/section_target_synthetic_evidence.py"
      - "tools/tests/test_section_target_combined.py"
      - "tools/tests/test_section_target_hardware.py"
      - "tools/tests/test_section_target_synthetic_evidence.py"
      - "docs/qualification/section/SECTION_TARGET_HARDWARE_COMBINED.md"
      - "crates/qualification/crucible-section-qualification/**"
      - "crates/world/**"
      - "crates/data/crucible-generated/**"
      - "vanilla/state-data/26.2-state-data-manifest.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Combined controlled evidence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Combined-controller regressions
        run: python3 -m unittest discover -s tools/tests -p 'test_section_target_combined.py' -v

      - name: Build content-addressed three-dimension smoke packs
        env:
          PACK_ROOT: ${{ runner.temp }}/crucible-section-combined-packs
        run: |
          set -euo pipefail
          rm -rf "$PACK_ROOT"
          mkdir -p "$PACK_ROOT"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import struct
          from pathlib import Path

          root = Path(os.environ['PACK_ROOT'])
          state_manifest = json.loads(Path('vanilla/state-data/26.2-state-data-manifest.json').read_text())
          target = {
              'minecraft_version': state_manifest['target']['minecraft_version'],
              'protocol_version': state_manifest['target']['protocol_version'],
              'data_version': state_manifest['target']['data_version'],
              'state_count': state_manifest['state_count'],
              'state_data_generation_sha256': state_manifest['generation_digest'],
              'state_data_input_sha256': state_manifest['input_digest'],
          }
          population_sha = 'a' * 64
          admission_sha = 'b' * 64
          dimensions = (
              'minecraft:overworld',
              'minecraft:the_nether',
              'minecraft:the_end',
          )
          packs = {}
          member_counts = [1, 1, 1, 0]
          for dimension_index, dimension in enumerate(dimensions):
              name = f'dimension-{dimension_index}.section-pack'
              path = root / name
              header = (
                  'CRUCIBLE-SECTION-BENCH-PACK|1\n'
                  f"TARGET|minecraft={target['minecraft_version']}|protocol={target['protocol_version']}|"
                  f"data={target['data_version']}|state_count={target['state_count']}|"
                  f"generation_sha256={target['state_data_generation_sha256']}\n"
                  f'POPULATION|population_sha256={population_sha}|admission_sha256={admission_sha}\n'
                  f'DIMENSION|name={dimension}|section_count=3\n'
                  'DATA\n'
              ).encode('ascii')
              sections = [
                  [0] * 4096,
                  [index % 17 for index in range(4096)],
                  [index % 257 for index in range(4096)],
              ]
              with path.open('wb') as handle:
                  handle.write(header)
                  for states in sections:
                      handle.write(struct.pack('<4096H', *states))
              packs[dimension] = {
                  'path': name,
                  'section_count': 3,
                  'total_cells': 3 * 4096,
                  'size': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          members = []
          for seed_index, count in enumerate(member_counts):
              members.append({
                  'seed_index': seed_index,
                  'corpus_sha256': hashlib.sha256(f'corpus-{seed_index}'.encode()).hexdigest(),
                  'per_dimension_sections': {dimension: count for dimension in dimensions},
              })

          manifest = {
              'schema': 1,
              'kind': 'section-target-benchmark-pack-set',
              'policy': 'vanilla-section-representative-v1',
              'population_sha256': population_sha,
              'admission_sha256': admission_sha,
              'source_artifact_manifest_sha256': 'c' * 64,
              'target': target,
              'members': members,
              'decision_scope': 'dimension-separated-only',
              'cross_dimension_score_allowed': False,
              'packs': packs,
          }
          encoded = json.dumps(manifest, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          manifest['manifest_sha256'] = hashlib.sha256(encoded).hexdigest()
          (root / 'pack-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Pick one allowed CPU
        id: cpu
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          allowed = sorted(os.sched_getaffinity(0))
          if not allowed:
              raise SystemExit('runner has no allowed CPU')
          print(f'cpu={allowed[0]}')
          PY

      - name: Run one combined session and all 20 child processes
        env:
          PACK_ROOT: ${{ runner.temp }}/crucible-section-combined-packs
          OUTPUT_ROOT: ${{ runner.temp }}/crucible-section-combined-output
          QUAL_CPU: ${{ steps.cpu.outputs.cpu }}
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_ROOT"
          python3 tools/section_target_combined.py \
            --repo-root . \
            --pack-root "$PACK_ROOT" \
            --output-dir "$OUTPUT_ROOT" \
            --cpu "$QUAL_CPU" \
            --rounds 1 \
            --smoke

      - name: Validate combined smoke evidence boundary
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/crucible-section-combined-output
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['OUTPUT_ROOT'])
          record = json.loads((root / 'combined-orchestration.json').read_text())
          if record['schema'] != 1 or record['kind'] != 'section-target-combined-orchestration':
              raise SystemExit('combined schema/kind mismatch')
          if record['mode'] != 'smoke' or record['rounds'] != 1:
              raise SystemExit('combined smoke identity mismatch')
          if record['qualification_complete'] is not True:
              raise SystemExit('combined smoke did not record completion')
          if record['population_evidence_eligible'] is not False:
              raise SystemExit('one-round smoke unexpectedly qualified population evidence')
          if record['synthetic_evidence_eligible'] is not False:
              raise SystemExit('one-round smoke unexpectedly qualified synthetic evidence')
          if record['combined_measurement_evidence_eligible'] is not False:
              raise SystemExit('one-round smoke unexpectedly qualified combined measurements')
          if record['decision_evidence_eligible'] is not False:
              raise SystemExit('combined measurement layer claimed decision eligibility')
          if record['decision_blockers'] != [
              'population evidence did not pass protocol/noise eligibility',
              'synthetic mechanism evidence did not pass protocol/noise eligibility',
              'dimension-separated Pareto selection record not assembled',
          ]:
              raise SystemExit(f"unexpected decision blockers: {record['decision_blockers']}")
          if record['decision_scope'] != 'dimension-separated-only' or record['cross_dimension_score_allowed'] is not False:
              raise SystemExit('combined cross-dimension firewall weakened')

          population_record = json.loads((root / 'population' / 'orchestration.json').read_text())
          if len(population_record['children']) != 15:
              raise SystemExit(f"expected 15 population children, got {len(population_record['children'])}")
          synthetic = record['synthetic']
          if len(synthetic['children']) != 5 or len(synthetic['schedule']) != 5:
              raise SystemExit('expected exactly five one-round synthetic children')
          if synthetic['noise_qualification']['protocol_eligible'] is not False:
              raise SystemExit('one-round synthetic smoke unexpectedly passed protocol')

          binary = root / 'population' / 'benchmark-executable'
          binary_sha = hashlib.sha256(binary.read_bytes()).hexdigest()
          if binary_sha != record['identities']['benchmark_executable_sha256']:
              raise SystemExit('combined retained executable identity mismatch')
          if binary_sha != population_record['identities']['benchmark_executable_sha256']:
              raise SystemExit('population and combined executable identities differ')
          for child in synthetic['children']:
              if child['benchmark_executable_sha256'] != binary_sha:
                  raise SystemExit('synthetic child used a different executable')
              evidence = root / child['child_evidence_path']
              if hashlib.sha256(evidence.read_bytes()).hexdigest() != child['child_evidence_sha256']:
                  raise SystemExit('synthetic child evidence hash mismatch')

          artifact = json.loads((root / 'artifact-manifest.json').read_text())
          if artifact['kind'] != 'section-target-combined-artifact':
              raise SystemExit('combined artifact kind mismatch')
          paths = {entry['path'] for entry in artifact['files']}
          required = {
              'combined-orchestration.json',
              'population/benchmark-executable',
              'population/orchestration.json',
              'population/artifact-manifest.json',
          }
          if not required.issubset(paths):
              raise SystemExit(f'combined artifact omitted required files: {required - paths}')
          synthetic_json = [path for path in paths if path.startswith('synthetic/') and path.endswith('.json')]
          if len(synthetic_json) != 5:
              raise SystemExit(f'combined artifact expected five synthetic JSON files, got {len(synthetic_json)}')
          for entry in artifact['files']:
              path = root / entry['path']
              if path.stat().st_size != entry['size']:
                  raise SystemExit(f"artifact size mismatch: {entry['path']}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != entry['sha256']:
                  raise SystemExit(f"artifact SHA mismatch: {entry['path']}")
          print('combined target-hardware smoke PASS')
          PY

      - name: Upload diagnostic combined evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: section-target-combined-smoke
          path: ${{ runner.temp }}/crucible-section-combined-output
          if-no-files-found: error
          retention-days: 7
