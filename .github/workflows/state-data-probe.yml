name: State Data Probe

on:
  pull_request:
    paths:
      - tools/state_data.py
      - tools/official_state_data.py
      - tools/state_source_qualification.py
      - tools/qualify_state_data.py
      - tools/finalize_state_data.py
      - tools/section_runtime_fixture.py
      - tools/tests/test_state_data.py
      - tools/tests/test_official_state_data.py
      - tools/tests/test_state_source_qualification.py
      - tools/tests/test_qualify_state_data.py
      - tools/tests/test_finalize_state_data.py
      - tools/tests/test_section_runtime_fixture.py
      - vanilla/state-data/**
      - vanilla/fixtures/section/**
      - vanilla/vanilla.lock.toml
      - crates/data/helve-generated/**
      - .github/workflows/state-data-probe.yml

permissions:
  contents: read

jobs:
  extract:
    name: Official 26.2 state facts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: State qualification tests
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_state_source_qualification.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_qualify_state_data.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_finalize_state_data.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_section_runtime_fixture.py' -v

      - name: Extract official state facts
        run: |
          python3 tools/official_state_data.py \
            --version 26.2 \
            --output /tmp/26.2-block-states.raw.json

      - name: Verify official runtime pin
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          data = json.loads(Path('/tmp/26.2-block-states.raw.json').read_text())
          with Path('vanilla/vanilla.lock.toml').open('rb') as handle:
              lock = tomllib.load(handle)
          actual = data['provenance']['server_sha256']
          expected = lock['runtime']['server_sha256']
          if actual != expected:
              raise SystemExit(
                  f'official 26.2 runtime SHA-256 mismatch: expected {expected}, got {actual}'
              )
          if data['provenance']['source'] != lock['runtime']['probe']:
              raise SystemExit('official runtime probe identity does not match vanilla.lock.toml')
          print(f'verified official runtime SHA-256: {actual}')
          PY

      - name: Inspect raw normalized data
        run: python3 tools/state_data.py inspect /tmp/26.2-block-states.raw.json

      - name: Bind section fixture to official runtime facts
        run: |
          python3 tools/section_runtime_fixture.py \
            --runtime-data /tmp/26.2-block-states.raw.json \
            --fixture vanilla/fixtures/section/26.2-semantic-fixtures.txt \
            --output /tmp/26.2-section-runtime-facts-fixture.json

      - name: Reproduce committed qualified state data byte-for-byte
        run: |
          python3 tools/qualify_state_data.py \
            --runtime-data /tmp/26.2-block-states.raw.json \
            --source-qualification vanilla/state-data/26.2-source-qualification.json \
            --output /tmp/26.2-block-states.qualified.json
          python3 tools/state_data.py generate /tmp/26.2-block-states.qualified.json \
            --assignment vanilla-identity \
            --output /tmp/target_26_2.qualified.rs \
            --manifest /tmp/26.2-state-data-qualified-manifest.json
          cmp --silent \
            crates/data/helve-generated/src/lib.rs \
            /tmp/target_26_2.qualified.rs || {
              echo 'generated Rust target data differs from committed output' >&2
              diff -u crates/data/helve-generated/src/lib.rs /tmp/target_26_2.qualified.rs | head -200
              exit 1
            }
          cmp --silent \
            vanilla/state-data/26.2-state-data-manifest.json \
            /tmp/26.2-state-data-qualified-manifest.json || {
              echo 'generated state-data manifest differs from committed output' >&2
              diff -u vanilla/state-data/26.2-state-data-manifest.json /tmp/26.2-state-data-qualified-manifest.json
              exit 1
            }
          echo 'qualified state data reproducibility PASS'

      - name: Generate unqualified smoke output
        run: |
          # This proves the low-level generator still consumes the runtime schema. Production
          # target data is generated only from the source+runtime-bound dataset.
          python3 tools/state_data.py generate /tmp/26.2-block-states.raw.json \
            --output /tmp/target_26_2.unqualified.rs \
            --manifest /tmp/26.2-state-data-unqualified-manifest.json
          python3 tools/state_data.py verify /tmp/26.2-block-states.raw.json \
            --output /tmp/target_26_2.unqualified.rs \
            --manifest /tmp/26.2-state-data-unqualified-manifest.json

      - name: Upload runtime evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minecraft-26.2-state-data-runtime-evidence
          path: |
            /tmp/26.2-block-states.raw.json
            /tmp/26.2-block-states.qualified.json
            /tmp/26.2-section-runtime-facts-fixture.json
            /tmp/target_26_2.qualified.rs
            /tmp/26.2-state-data-qualified-manifest.json
            /tmp/target_26_2.unqualified.rs
            /tmp/26.2-state-data-unqualified-manifest.json
          if-no-files-found: error
          retention-days: 7
