name: R2B Performance Evidence

on:
  pull_request:
    paths:
      - crates/network/crucible-target-26-2/**
      - crates/crucible-server/src/r2b_server.rs
      - crates/crucible-server/benches/r2b_join_arrival.rs
      - crates/qualification/crucible-client-spine-qualification/src/bin/r2b_bootstrap_arena_bench.rs
      - docs/qualification/R2B_PERFORMANCE_EVIDENCE.md
      - docs/qualification/R2B_PREPARE_SCRATCH_SWEEP.md
      - docs/qualification/R2B_JOIN_ARRIVAL_SMOOTHNESS.md
      - .github/workflows/r2b-performance-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  evidence:
    name: R2B performance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Select one benchmark CPU
        run: |
          allowed="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          first="${allowed%%,*}"
          first="${first%%-*}"
          test -n "${first}"
          echo "CRUCIBLE_BENCH_CPU=${first}" >> "${GITHUB_ENV}"
          echo "benchmark cpu: ${first} (allowed: ${allowed})"

      - name: Run shared-artifact paired smoke
        run: |
          for repetition in 1 2 3; do
            taskset -c "${CRUCIBLE_BENCH_CPU}" \
              cargo bench --locked \
              --package crucible-target-26-2 \
              --bench r2b_shared_artifact -- \
              --smoke \
              --output "${GITHUB_WORKSPACE}/target/crucible-qualification/r2b/shared-artifact-smoke-${repetition}.json"
          done

      - name: Validate shared-artifact evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path('target/crucible-qualification/r2b').glob('shared-artifact-smoke-*.json'))
          assert len(paths) == 3
          rows = [json.loads(path.read_text()) for path in paths]
          checksums = {row['semantic_checksum'] for row in rows}
          assert len(checksums) == 1

          for data in rows:
              assert data['schema'] == 2
              assert data['benchmark'] == 'r2b-shared-artifact-validation'
              assert data['mode'] == 'smoke'
              assert data['hosted_ci_is_diagnostic_only'] is True
              assert data['production_path_is_construction_certified'] is True
              assert data['sampling']['pattern'] == 'balanced-abba-baab'
              assert data['sampling']['measured_blocks'] > 0
              assert data['sampling']['joins_per_sample'] > 0
              assert data['sampling']['samples_per_candidate'] == len(data['reference_sample_ns'])
              assert data['sampling']['samples_per_candidate'] == len(data['certified_sample_ns'])
              assert data['sampling']['measured_blocks'] == len(data['paired_block_ratio_ppm'])
              assert data['sampling']['epoch_count'] == len(data['epoch_ratio_ppm'])
              assert data['host']['available_parallelism'] > 0
              assert data['structural']['reference_packet_id_decodes_per_join'] == 3
              assert data['structural']['certified_packet_id_decodes_per_join'] == 0
              assert data['structural']['additional_allocations_per_join'] == 0
              assert data['semantic_checksum'] != 0
              assert data['reference_service_ns']['count'] == data['sampling']['samples_per_candidate']
              assert data['certified_service_ns']['count'] == data['sampling']['samples_per_candidate']
              assert data['reference_service_ns']['p50'] > 0
              assert data['certified_service_ns']['p50'] > 0
              assert data['reference_service_ns']['p99'] >= data['reference_service_ns']['p50']
              assert data['certified_service_ns']['p99'] >= data['certified_service_ns']['p50']
              assert data['reference_service_ns']['p999'] >= data['reference_service_ns']['p99']
              assert data['certified_service_ns']['p999'] >= data['certified_service_ns']['p99']
              assert data['paired_block_ratio']['p50'] > 0
              assert data['epoch_ratio']['p50'] > 0

          directions = [row['direction']['certified_faster_paired_p50'] for row in rows]
          print('shared-artifact independent directions:', directions)
          for index, data in enumerate(rows, start=1):
              print(
                  f'run {index}:',
                  'paired_p50_ppm=', data['paired_block_ratio']['p50'],
                  'paired_mad=', data['paired_block_ratio']['mad'],
                  'epoch_p50_ppm=', data['epoch_ratio']['p50'],
                  'epoch_win_rate_ppm=', data['direction']['certified_faster_epoch_rate_ppm'],
                  'reference_p99_ns=', data['reference_service_ns']['p99'],
                  'certified_p99_ns=', data['certified_service_ns']['p99'],
                  'reference_p999_ns=', data['reference_service_ns']['p999'],
                  'certified_p999_ns=', data['certified_service_ns']['p999'],
                  'reference_relative_mad_ppm=', data['reference_service_ns']['relative_mad_ppm'],
                  'certified_relative_mad_ppm=', data['certified_service_ns']['relative_mad_ppm'],
              )
          PY

      - name: Run preparation-scratch reservation smoke
        run: |
          for repetition in 1 2 3; do
            taskset -c "${CRUCIBLE_BENCH_CPU}" \
              cargo bench --locked \
              --package crucible-target-26-2 \
              --bench r2b_prepare_scratch -- \
              --smoke \
              --output "${GITHUB_WORKSPACE}/target/crucible-qualification/r2b/prepare-scratch-smoke-${repetition}.json"
          done

      - name: Validate preparation-scratch evidence
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          paths = sorted(Path('target/crucible-qualification/r2b').glob('prepare-scratch-smoke-*.json'))
          assert len(paths) == 3
          rows = [json.loads(path.read_text()) for path in paths]
          reservations = {64, 128, 256, 512, 1024, 2048, 4096}
          workloads = {'fresh-clear', 'populated-raining'}
          grouped = defaultdict(list)

          for run_index, data in enumerate(rows, start=1):
              assert data['schema'] == 1
              assert data['benchmark'] == 'r2b-prepare-scratch-reservation'
              assert data['mode'] == 'smoke'
              assert data['hosted_ci_is_diagnostic_only'] is True
              assert data['scratch_maximum_bytes'] == 4096
              assert data['sampling']['pattern'] == 'balanced-abba-baab'
              assert data['sampling']['measured_blocks'] > 0
              assert data['sampling']['joins_per_sample'] > 0
              assert len(data['comparisons']) == len(reservations) * len(workloads)
              seen = set()
              for comparison in data['comparisons']:
                  key = (comparison['workload'], comparison['reservation_bytes'])
                  assert comparison['workload'] in workloads
                  assert comparison['reservation_bytes'] in reservations
                  assert key not in seen
                  seen.add(key)
                  assert comparison['semantic_checksum'] != 0
                  assert comparison['largest_body_bytes'] > 0
                  for stats_name in ('baseline_ns', 'candidate_ns', 'paired_ratio_ppm', 'epoch_ratio_ppm'):
                      stats = comparison[stats_name]
                      assert stats['count'] > 0
                      assert stats['p50'] > 0
                      assert stats['p99'] >= stats['p50']
                      assert stats['p999'] >= stats['p99']
                  assert len(comparison['epoch_ratios']) == comparison['epoch_ratio_ppm']['count']
                  grouped[key].append((run_index, comparison))
              assert seen == {(workload, reservation) for workload in workloads for reservation in reservations}

          for key in sorted(grouped):
              print('scratch candidate', key)
              for run_index, comparison in grouped[key]:
                  print(
                      f'  run {run_index}:',
                      'paired_p50_ppm=', comparison['paired_ratio_ppm']['p50'],
                      'paired_mad=', comparison['paired_ratio_ppm']['mad'],
                      'epoch_p50_ppm=', comparison['epoch_ratio_ppm']['p50'],
                      'epoch_win_rate_ppm=', comparison['candidate_faster_epoch_rate_ppm'],
                      'baseline_p99_ns=', comparison['baseline_ns']['p99'],
                      'candidate_p99_ns=', comparison['candidate_ns']['p99'],
                      'baseline_p999_ns=', comparison['baseline_ns']['p999'],
                      'candidate_p999_ns=', comparison['candidate_ns']['p999'],
                      'candidate_relative_mad_ppm=', comparison['candidate_ns']['relative_mad_ppm'],
                      'largest_body_bytes=', comparison['largest_body_bytes'],
                  )
          PY

      - name: Run join-arrival smoothness smoke
        run: >-
          taskset -c "${CRUCIBLE_BENCH_CPU}"
          cargo bench --locked
          --package crucible-server
          --bench r2b_join_arrival --
          --smoke
          --output "${GITHUB_WORKSPACE}/target/crucible-qualification/r2b/join-arrival-smoke.json"

      - name: Validate join-arrival evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('target/crucible-qualification/r2b/join-arrival-smoke.json')
          data = json.loads(path.read_text())
          assert data['schema'] == 1
          assert data['benchmark'] == 'r2b-join-arrival-smoothness'
          assert data['mode'] == 'smoke'
          assert data['hosted_ci_is_diagnostic_only'] is True
          assert data['runtime_scheduler_selected_by_this_benchmark'] is False
          assert data['model_scope'] == 'one-r2b-entry-service-lane'
          assert data['timed_boundary'] == 'enter_r2b_play_blocking_transport-to-WorldProjectionReady'
          assert data['sampling']['warmup_joins'] == 64
          assert data['sampling']['measured_joins'] == 512
          assert data['sampling']['joins_per_epoch'] == 64
          assert data['host']['available_parallelism'] > 0

          witness = data['semantic_witness']
          assert witness['output_bytes'] > 0
          assert witness['output_checksum'] != 0
          assert witness['read_calls'] == 3
          assert witness['read_bytes'] > 0
          assert witness['retained_read_scratch_bytes'] == 16 * 1024
          assert witness['pending_teleport_id'] == 1

          def validate_stats(stats, expected_count=None):
              assert stats['count'] > 0
              if expected_count is not None:
                  assert stats['count'] == expected_count
              assert stats['min'] <= stats['p01'] <= stats['p05'] <= stats['p50']
              assert stats['p50'] <= stats['p95'] <= stats['p99'] <= stats['p999'] <= stats['max']
              assert stats['mean'] > 0 or stats['max'] == 0
              assert stats['mad'] >= 0
              assert stats['relative_mad_ppm'] >= 0

          validate_stats(data['service_ns'], 512)
          validate_stats(data['service_epoch_mean_ns'], 8)
          assert data['service_ns']['p50'] > 0

          expected_profiles = {
              'steady-80pct',
              'steady-95pct',
              'burst-8of64-phase0',
              'burst-8of64-phase16',
              'burst-8of64-phase32',
              'burst-8of64-phase48',
          }
          assert len(data['profiles']) == len(expected_profiles)
          assert {profile['name'] for profile in data['profiles']} == expected_profiles
          for profile in data['profiles']:
              assert profile['nominal_interval_ns'] > 0
              assert profile['effective_offered_load_ppm'] > 0
              assert 0 <= profile['queued_join_rate_ppm'] <= 1_000_000
              assert 0 <= profile['compressed_completion_rate_ppm'] <= 1_000_000
              assert 0 <= profile['max_queued_run'] <= 512
              assert profile['modeled_span_ns'] > 0
              validate_stats(profile['queue_delay_ns'], 512)
              validate_stats(profile['sojourn_ns'], 512)
              validate_stats(profile['completion_spacing_ns'], 511)
              validate_stats(profile['backlog_in_system'], 512)

          print(
              'join-arrival:',
              'service_p50_ns=', data['service_ns']['p50'],
              'service_p99_ns=', data['service_ns']['p99'],
              'service_p999_ns=', data['service_ns']['p999'],
          )
          for profile in data['profiles']:
              print(
                  profile['name'],
                  'load_ppm=', profile['effective_offered_load_ppm'],
                  'queue_p99_ns=', profile['queue_delay_ns']['p99'],
                  'queue_p999_ns=', profile['queue_delay_ns']['p999'],
                  'backlog_max=', profile['backlog_in_system']['max'],
                  'gap_p01_ns=', profile['completion_spacing_ns']['p01'],
                  'compressed_ppm=', profile['compressed_completion_rate_ppm'],
                  'max_queued_run=', profile['max_queued_run'],
              )
          PY

      - name: Run dynamic-arena structural smoke
        run: >-
          taskset -c "${CRUCIBLE_BENCH_CPU}"
          cargo run --release --locked
          --package crucible-client-spine-qualification
          --bin r2b_bootstrap_arena_bench --
          --smoke
          --output "${GITHUB_WORKSPACE}/target/crucible-qualification/r2b/bootstrap-arena-smoke.json"

      - name: Validate dynamic-arena evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('target/crucible-qualification/r2b/bootstrap-arena-smoke.json')
          data = json.loads(path.read_text())
          assert data['benchmark'] == 'r2b-dynamic-bootstrap-storage'
          assert data['mode'] == 'smoke'
          assert data['hosted_ci_is_diagnostic_only'] is True
          assert data['production_mechanism_selected_by_this_run'] is False
          assert data['dynamic_body_count'] > 0
          assert data['measured_rounds'] > 0
          assert data['workloads']
          assert all(row['byte_equivalent'] is True for row in data['workloads'])
          assert all(row['semantic_checksum'] != 0 for row in data['workloads'])
          print('dynamic-arena workloads:', len(data['workloads']))
          PY

      - name: Upload diagnostic R2B evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crucible-r2b-performance-evidence
          path: target/crucible-qualification/r2b/*.json
          if-no-files-found: error
          retention-days: 7