name: R2C Format Compression Once

on:
  push:
    branches:
      - r2c/pregenerated-world-compression

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: r2c/pregenerated-world-compression
          persist-credentials: true

      - name: Install pinned Rustfmt
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Format import crate
        run: cargo +1.97.1 fmt --package helve-world-import

      - name: Commit formatter-only changes
        run: |
          git add \
            crates/world/helve-world-import/src/compression.rs \
            crates/world/helve-world-import/src/lib.rs \
            crates/world/helve-world-import/tests/compressed_transaction.rs
          if git diff --cached --quiet; then
            echo "codec files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R2C: format bounded compression codec"
          git push origin HEAD:r2c/pregenerated-world-compression
