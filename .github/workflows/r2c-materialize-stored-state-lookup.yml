name: R2C Materialize Stored State Lookup

on:
  push:
    branches:
      - r2c/pregenerated-world-import-reference

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: r2c/pregenerated-world-import-reference
          persist-credentials: true

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Regenerate exact qualified state input
        run: |
          python3 tools/official_state_data.py \
            --version 26.2 \
            --output /tmp/26.2-block-states.raw.json
          python3 tools/qualify_state_data.py \
            --runtime-data /tmp/26.2-block-states.raw.json \
            --source-qualification vanilla/state-data/26.2-source-qualification.json \
            --output /tmp/26.2-block-states.qualified.json

      - name: Materialize deterministic lookup
        run: |
          python3 tools/stored_state_lookup.py generate \
            /tmp/26.2-block-states.qualified.json \
            --state-manifest vanilla/state-data/26.2-state-data-manifest.json \
            --output crates/world/helve-world-import/src/generated_state_lookup.rs \
            --binary-output crates/world/helve-world-import/src/generated/26.2-stored-state-lookup.bin \
            --manifest vanilla/state-data/26.2-stored-state-lookup-manifest.json

      - name: Commit generated artifacts
        run: |
          git add \
            crates/world/helve-world-import/src/generated_state_lookup.rs \
            crates/world/helve-world-import/src/generated/26.2-stored-state-lookup.bin \
            vanilla/state-data/26.2-stored-state-lookup-manifest.json
          if git diff --cached --quiet; then
            echo "generated lookup already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R2C: materialize exact stored-state lookup"
          git push origin HEAD:r2c/pregenerated-world-import-reference
