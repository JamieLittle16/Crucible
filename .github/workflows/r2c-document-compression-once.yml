name: R2C Document Compression Once

on:
  push:
    branches:
      - r2c/pregenerated-world-compression

permissions:
  contents: write

jobs:
  document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: r2c/pregenerated-world-compression
          persist-credentials: true

      - name: Update qualification record
        run: python3 tools/r2c_document_compression_once.py

      - name: Install pinned Rustfmt
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Preserve canonical Rust formatting
        run: cargo +1.97.1 fmt --package helve-world-import

      - name: Commit qualification record
        run: |
          git add \
            crates/world/helve-world-import/src/compression.rs \
            docs/qualification/R2C_PREGENERATED_WORLD_IMPORT_QUALIFICATION.md
          if git diff --cached --quiet; then
            echo "compression qualification record already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R2C: record bounded gzip zlib qualification"
          git push origin HEAD:r2c/pregenerated-world-compression
