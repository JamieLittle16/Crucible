name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust and tooling quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
          rustfmt --version
          cargo clippy --version
          python3 --version

      # crucible-generated is byte-for-byte owned by tools/state_data.py and its
      # exact output is checked by the state-data qualification pipeline. Keep it
      # in the workspace for check/clippy/test/doc, but never let rustfmt become a
      # second writer of generated artifacts.
      - name: Format handwritten Rust
        run: >-
          cargo fmt
          --package crucible-types
          --package crucible-component
          --package crucible-section-qualification
          --package crucible-section-vanilla-fixture
          --package crucible-world-contract
          --package crucible-world-reference
          --package crucible-world-section
          --package xtask
          -- --check

      - name: Check all targets
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features --locked

      - name: Verify source-reviewed fixture provenance
        run: >-
          python3 tools/verify_section_fixture.py
          vanilla/fixtures/world/section/26.2-source-reviewed-count-gates.fixture

      - name: Section semantic qualification
        run: >-
          cargo xtask qualify section --quick
          --vanilla vanilla/fixtures/world/section/26.2-source-reviewed-count-gates.fixture

      - name: Vanilla Atlas tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Python syntax
        run: >-
          python3 -m py_compile
          tools/vanilla_atlas.py
          tools/verify_section_fixture.py
          tools/tests/test_vanilla_atlas.py
          tools/tests/test_verify_section_fixture.py

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --document-private-items --locked

  repository-guard:
    name: Repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Guard
        run: cargo xtask guard
