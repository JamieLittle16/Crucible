name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust and tooling quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
          rustfmt --version
          cargo clippy --version
          python3 --version

      - name: Supply-chain and dependency policy
        run: python3 tools/ci_policy.py

      - name: Composition lock and generated wiring
        run: >-
          python3 tools/composition_resolver.py check
          --repo-root .
          --profile profiles/reference.toml

      # crucible-generated and crucible-composition are byte-for-byte owned by
      # their generators. Keep them in the workspace for check/clippy/test/doc,
      # but never let rustfmt become a second writer of generated artifacts.
      # The 26.2 target's generated facts are included! from a generated path;
      # rustfmt checks the handwritten crate root without rewriting that file.
      - name: Format handwritten Rust
        run: >-
          cargo fmt
          --package crucible-types
          --package crucible-component
          --package crucible-connection-core
          --package crucible-connection-driver
          --package crucible-packet-core
          --package crucible-preplay-core
          --package crucible-preplay-io
          --package crucible-protocol-core
          --package crucible-session-core
          --package crucible-target-26-2
          --package crucible-benchmark-support
          --package crucible-client-spine-qualification
          --package crucible-composition-qualification
          --package crucible-executor-baseline
          --package crucible-ownership-qualification
          --package crucible-section-qualification
          --package crucible-world-access-qualification
          --package crucible-world-chunk
          --package crucible-world-contract
          --package crucible-world-reference
          --package crucible-world-section
          --package xtask
          -- --check

      - name: Check all targets
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Protocol wire qualification
        run: cargo test --package crucible-protocol-core --locked

      - name: Packet body qualification
        run: cargo test --package crucible-packet-core --locked

      - name: Connection buffer qualification
        run: cargo test --package crucible-connection-core --locked

      - name: Connection driver qualification
        run: cargo test --package crucible-connection-driver --locked

      - name: Pre-play production binder qualification
        run: cargo test --package crucible-preplay-core --locked

      - name: Pre-play I/O adapter qualification
        run: cargo test --package crucible-preplay-io --locked

      - name: Session state qualification
        run: cargo test --package crucible-session-core --locked

      - name: Minecraft 26.2 R0 target qualification
        run: cargo test --package crucible-target-26-2 --locked

      - name: Client spine integration qualification
        run: cargo test --package crucible-client-spine-qualification --locked

      # Hosted timing is diagnostic only. Production stays on the admitted two-stage
      # PacketWriter -> EgressBuffer path until controlled target-hardware evidence
      # demonstrates a material whole-cost win for the fused candidate.
      - name: Fused outbound benchmark smoke
        run: |
          cargo run --release --locked \
            --package crucible-client-spine-qualification \
            --bin fused_outbound_bench -- \
            --smoke \
            --output target/fused-outbound-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("target/fused-outbound-smoke.json").read_text())
          assert artifact["schema"] == 1
          assert artifact["benchmark"] == "fused-outbound-construction"
          assert artifact["mode"] == "smoke"
          assert artifact["hosted_ci_is_diagnostic_only"] is True
          assert artifact["production_path_unchanged"] is True
          assert len(artifact["cases"]) == 5
          for case in artifact["cases"]:
              assert case["byte_equivalent"] is True
              assert case["paired_rounds"]
              assert case["semantic_checksum"] != 0
          PY

      - name: Rust tests
        run: cargo test --workspace --all-features --locked

      # Hosted timing is diagnostic only. Structural concrete-type identity is the
      # primary composition zero-cost proof; this protects the HOT loop against drift.
      - name: Composition HOT benchmark smoke
        run: |
          cargo run --release --locked \
            --package crucible-composition-qualification \
            --bin composition_hot_bench -- \
            --smoke \
            --output target/composition-hot-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("target/composition-hot-smoke.json").read_text())
          assert artifact["schema"] == 1
          assert artifact["benchmark"] == "composition-hot-tax"
          assert artifact["mode"] == "smoke"
          assert artifact["hosted_ci_is_diagnostic_only"] is True
          assert artifact["structural"]["exact_type_identity"] is True
          assert artifact["paired_rounds"]
          assert artifact["semantic_checksum"] != 0
          PY

      # Hosted timing is smoke-only. The permanent assertion here is semantic
      # topology independence plus evidence shape; target-hardware timing selects nothing.
      - name: Executor worker baseline smoke
        run: |
          cargo run --release --locked \
            --package crucible-executor-baseline \
            --bin executor_baseline_bench -- \
            --smoke \
            --output target/executor-baseline-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("target/executor-baseline-smoke.json").read_text())
          assert artifact["schema"] == 1
          assert artifact["benchmark"] == "executor-worker-memory-baseline"
          assert artifact["mode"] == "smoke"
          assert artifact["hosted_ci_is_diagnostic_only"] is True
          assert artifact["semantic_reference"]["stage_count"] == 4
          assert artifact["semantic_reference"]["useful_operations"] == 65536
          assert artifact["semantic_reference"]["work_checksum"] != 0
          assert [candidate["workers"] for candidate in artifact["candidates"]] == [1, 2, 4]
          assert len(artifact["rounds"]) == 9
          for candidate in artifact["candidates"]:
              assert candidate["p50_ns"] > 0
              assert candidate["logical_memory"]["total_accounted_bytes"] > 0
          PY

      # Hosted timing is diagnostic only. This step proves the release harness runs,
      # preserves semantic work, and emits parseable evidence; it cannot select a winner.
      - name: World-access benchmark smoke
        run: |
          cargo run --release --locked \
            --package crucible-world-access-qualification \
            --bin world_access_bench -- \
            --smoke \
            --output target/world-access-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("target/world-access-smoke.json").read_text())
          assert artifact["schema"] == 1
          assert artifact["benchmark"] == "resolved-chunk-window"
          assert artifact["mode"] == "smoke"
          assert artifact["hosted_ci_is_diagnostic_only"] is True
          assert len(artifact["cases"]) == 3
          for case in artifact["cases"]:
              assert case["paired_rounds"]
              assert case["setup_samples_ns"]
              assert case["whole_cost_samples"]
          PY

      - name: Section semantic qualification
        run: cargo xtask qualify section --quick

      - name: Source-backed section fixture qualification
        run: >-
          cargo xtask qualify section
          --vanilla vanilla/fixtures/section/26.2-semantic-fixtures.txt

      - name: Python tooling tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Python syntax
        run: python3 -m compileall -q tools

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --document-private-items --locked

  repository-guard:
    name: Repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Guard
        run: cargo xtask guard
