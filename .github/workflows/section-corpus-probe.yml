name: Section Corpus Probe

on:
  pull_request:
    paths:
      - tools/official_state_data.py
      - tools/qualify_state_data.py
      - tools/official_section_world.py
      - tools/vanilla_section_extractor.py
      - tools/r2c_genuine_save_differential.py
      - tools/section_corpus.py
      - tools/section_corpus_import_evidence.py
      - tools/tests/test_vanilla_section_extractor.py
      - tools/tests/test_r2c_genuine_save_differential.py
      - tools/tests/test_section_corpus.py
      - tools/tests/test_section_corpus_import_evidence.py
      - crates/qualification/helve-section-qualification/src/bin/section_bench/**
      - crates/qualification/helve-world-load-qualification/**
      - crates/data/helve-generated/**
      - crates/world/helve-world-chunk/**
      - crates/world/helve-world-contract/**
      - crates/world/helve-world-import/**
      - crates/world/helve-world-load/**
      - crates/world/helve-world-reference/**
      - crates/world/helve-world-runtime/**
      - crates/world/helve-world-section/**
      - vendor/adler2-2.0.1/**
      - vendor/miniz_oxide-0.8.9/**
      - .cargo/config.toml
      - vanilla/state-data/**
      - vanilla/vanilla.lock.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/section-corpus-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: Official 26.2 spawn-world corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Corpus and extractor regressions
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_section_corpus.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_vanilla_section_extractor.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_section_corpus_import_evidence.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_r2c_genuine_save_differential.py' -v

      - name: Extract official runtime state identities
        run: |
          python3 tools/official_state_data.py \
            --version 26.2 \
            --output /tmp/26.2-block-states.raw.json

      - name: Bind runtime identities to committed source qualification
        run: |
          python3 tools/qualify_state_data.py \
            --runtime-data /tmp/26.2-block-states.raw.json \
            --source-qualification vanilla/state-data/26.2-source-qualification.json \
            --output /tmp/26.2-block-states.qualified.json

      - name: Verify bound state identity matches frozen generator input
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import state_data

          qualified = json.loads(Path('/tmp/26.2-block-states.qualified.json').read_text())
          manifest = json.loads(Path('vanilla/state-data/26.2-state-data-manifest.json').read_text())
          actual = state_data.digest(qualified)
          expected = manifest['input_digest']
          if actual != expected:
              raise SystemExit(
                  f'bound qualified-state digest mismatch: expected {expected}, got {actual}'
              )
          print(f'verified frozen qualified-state input digest: {actual}')
          PY

      - name: Generate deterministic official spawn world
        run: |
          python3 tools/official_section_world.py \
            --version 26.2 \
            --work-dir /tmp/helve-section-world \
            --cache /tmp/helve-vanilla-downloads \
            --evidence /tmp/official-world-evidence.json

      - name: Extract stored overworld sections
        run: |
          python3 tools/vanilla_section_extractor.py \
            --world /tmp/helve-section-world/world \
            --qualified-states /tmp/26.2-block-states.qualified.json \
            --dimension minecraft:overworld \
            --output /tmp/26.2-spawn-sections.corpus \
            --inventory /tmp/26.2-spawn-sections.inventory.json

      - name: Build production raw-Anvil fact emitter
        run: >-
          cargo build --release --offline --locked
          --package helve-world-import
          --bin r2c_import_section_facts

      - name: Compare production importer with official-save oracle
        run: |
          python3 tools/r2c_genuine_save_differential.py \
            --world /tmp/helve-section-world/world \
            --corpus /tmp/26.2-spawn-sections.corpus \
            --rust-emitter target/release/r2c_import_section_facts \
            --work-dir /tmp/r2c-genuine-save-differential \
            --dimension minecraft:overworld \
            --evidence /tmp/26.2-production-import-differential.json

      - name: Build import-to-resident qualification harness
        run: >-
          cargo build --release --offline --locked
          --package helve-world-load-qualification
          --bin r2c_import_resident_bench

      - name: Measure official save import through residency
        run: |
          target/release/r2c_import_resident_bench \
            --world /tmp/helve-section-world/world/dimensions/minecraft/overworld \
            --warmup-rounds 1 \
            --measured-rounds 2 \
            --output /tmp/26.2-import-resident-hosted.json

      - name: Independently validate normalized corpus
        run: |
          python3 tools/section_corpus.py validate \
            /tmp/26.2-spawn-sections.corpus \
            --manifest /tmp/26.2-spawn-sections.manifest.json

      - name: Reconstruct official corpus through every Rust candidate
        run: |
          cargo run --release --locked \
            -p helve-section-qualification \
            --bin section_bench -- \
            --corpus-check /tmp/26.2-spawn-sections.corpus \
            --output /tmp/26.2-spawn-sections.rust-import.json

      - name: Require parser-admission corpus to fail production-decision gate
        run: |
          set +e
          cargo run --release --locked \
            -p helve-section-qualification \
            --bin section_bench -- \
            --corpus-decision-check /tmp/26.2-spawn-sections.corpus \
            > /tmp/26.2-spawn-sections.decision-rejection.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/26.2-spawn-sections.decision-rejection.log
            echo "parser-admission corpus unexpectedly passed decision gate" >&2
            exit 1
          fi
          if ! grep -q 'not decision-eligible' /tmp/26.2-spawn-sections.decision-rejection.log; then
            cat /tmp/26.2-spawn-sections.decision-rejection.log
            echo "decision gate failed for an unexpected reason" >&2
            exit 1
          fi
          cat /tmp/26.2-spawn-sections.decision-rejection.log

      - name: Cross-check independent Python and Rust corpus evidence
        run: |
          python3 tools/section_corpus_import_evidence.py \
            --manifest /tmp/26.2-spawn-sections.manifest.json \
            --rust-import /tmp/26.2-spawn-sections.rust-import.json

      - name: Verify real-target evidence identities
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          world = json.loads(Path('/tmp/official-world-evidence.json').read_text())
          inventory = json.loads(Path('/tmp/26.2-spawn-sections.inventory.json').read_text())
          corpus = json.loads(Path('/tmp/26.2-spawn-sections.manifest.json').read_text())
          rust = json.loads(Path('/tmp/26.2-spawn-sections.rust-import.json').read_text())
          production_import = json.loads(
              Path('/tmp/26.2-production-import-differential.json').read_text()
          )
          resident_load = json.loads(
              Path('/tmp/26.2-import-resident-hosted.json').read_text()
          )
          with Path('vanilla/vanilla.lock.toml').open('rb') as handle:
              lock = tomllib.load(handle)
          state_manifest = json.loads(
              Path('vanilla/state-data/26.2-state-data-manifest.json').read_text()
          )

          if world['server_sha256'] != lock['runtime']['server_sha256']:
              raise SystemExit('world generator did not use the pinned official server')
          if world['minecraft_version'] != '26.2':
              raise SystemExit('world generator target drifted')
          if inventory['policy'] != 'vanilla-save-region-v1-stored-sections':
              raise SystemExit('unexpected corpus extraction policy')
          if inventory['section_count'] <= 0:
              raise SystemExit('official spawn corpus contains no stored sections')
          if corpus['corpus_sha256'] != inventory['corpus_sha256']:
              raise SystemExit('corpus manifest/inventory digest mismatch')
          if corpus['source']['inventory_sha256'] != inventory['inventory_sha256']:
              raise SystemExit('corpus source-inventory digest mismatch')
          if (
              corpus['target']['state_data_generation_sha256']
              != state_manifest['generation_digest']
          ):
              raise SystemExit('corpus target state-data generation digest mismatch')
          if corpus['target']['state_data_input_sha256'] != state_manifest['input_digest']:
              raise SystemExit('corpus target state-data input digest mismatch')
          if rust['state_data_generation_sha256'] != state_manifest['generation_digest']:
              raise SystemExit('Rust importer generation digest mismatch')
          if rust['state_data_input_sha256'] != state_manifest['input_digest']:
              raise SystemExit('Rust importer input digest mismatch')
          if production_import['policy'] != 'production-anvil-vs-python-corpus-v1':
              raise SystemExit('unexpected production importer differential policy')
          if production_import['dimension'] != 'minecraft:overworld':
              raise SystemExit('production importer differential dimension drifted')
          if production_import['section_count'] != corpus['section_count']:
              raise SystemExit('production importer did not compare every corpus section')
          if production_import['cell_count'] != corpus['total_cells']:
              raise SystemExit('production importer did not compare every corpus cell')
          if production_import['corpus_sha256'] != corpus['corpus_sha256']:
              raise SystemExit('production importer compared a different corpus identity')

          if resident_load['kind'] != 'r2c-import-resident-cpu-qualification':
              raise SystemExit('unexpected import-resident evidence kind')
          if resident_load['mode'] != 'hosted-diagnostic':
              raise SystemExit('hosted import-resident evidence mode drifted')
          if resident_load['production_decision_eligible'] is not False:
              raise SystemExit('hosted import-resident evidence became decision-eligible')
          if resident_load['profile'] != {
              'dimension': 'minecraft:overworld',
              'min_block_y': -64,
              'height': 384,
              'section_count': 24,
          }:
              raise SystemExit('import-resident Overworld profile drifted')
          if resident_load['state_data']['input_sha256'] != state_manifest['input_digest']:
              raise SystemExit('import-resident state-data input digest mismatch')
          if (
              resident_load['state_data']['generation_sha256']
              != state_manifest['generation_digest']
          ):
              raise SystemExit('import-resident state-data generation digest mismatch')
          if resident_load['world']['region_files'] != len(
              list(
                  Path(
                      '/tmp/helve-section-world/world/dimensions/minecraft/overworld/region'
                  ).glob('r.*.*.mca')
              )
          ):
              raise SystemExit('import-resident region-file count mismatch')
          if resident_load['world']['chunks'] <= 0:
              raise SystemExit('import-resident benchmark observed no chunks')
          if resident_load['scratch']['grew_during_measurement']:
              raise SystemExit('importer section scratch grew after warmup')
          if resident_load['scratch']['decoder_grew_during_measurement']:
              raise SystemExit('decompression output scratch grew after warmup')

          measured_rounds = resident_load['config']['measured_rounds']
          built_sections = (
              resident_load['builder']['uniform_sections']
              + resident_load['builder']['dense_sections']
          )
          expected_sections = corpus['section_count'] * measured_rounds
          if built_sections != expected_sections:
              raise SystemExit(
                  'import-resident builder did not materialize every official corpus section: '
                  f'expected {expected_sections}, got {built_sections}'
              )
          if resident_load['builder']['dense_cells_copied'] != (
              resident_load['builder']['dense_sections'] * 4096
          ):
              raise SystemExit('dense section copy accounting drifted')
          if resident_load['builder']['retained_cells_written'] != built_sections * 4096:
              raise SystemExit('retained section write accounting drifted')
          if resident_load['samples_ns']['whole_chunk']['count'] != (
              resident_load['world']['chunks'] * measured_rounds
          ):
              raise SystemExit('whole-chunk sample count mismatch')
          if resident_load['samples_ns']['round']['count'] != measured_rounds:
              raise SystemExit('whole-round sample count mismatch')

          print(
              'official section corpus PASS: '
              f"sections={corpus['section_count']} "
              f"cells={corpus['total_cells']} "
              f"states={corpus['distinct_state_ids']} "
              f"inventory={inventory['inventory_sha256']} "
              f"corpus={corpus['corpus_sha256']} "
              f"production_semantic={production_import['semantic_sha256']} "
              f"resident_chunks={resident_load['world']['chunks']} "
              f"resident_p99_ns={resident_load['samples_ns']['whole_chunk']['p99']}"
          )
          PY

      - name: Upload normalized corpus evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minecraft-26.2-section-corpus-probe
          path: |
            /tmp/official-world-evidence.json
            /tmp/26.2-spawn-sections.inventory.json
            /tmp/26.2-spawn-sections.manifest.json
            /tmp/26.2-spawn-sections.rust-import.json
            /tmp/26.2-production-import-differential.json
            /tmp/26.2-import-resident-hosted.json
            /tmp/26.2-spawn-sections.decision-rejection.log
            /tmp/26.2-spawn-sections.corpus
          if-no-files-found: error
          retention-days: 7