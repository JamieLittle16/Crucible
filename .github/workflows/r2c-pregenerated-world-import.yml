name: R2C Pregenerated World Import Qualification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/world/helve-world-import/**"
      - "crates/world/helve-world-load/**"
      - "docs/qualification/R2C_PREGENERATED_WORLD_IMPORT_QUALIFICATION.md"
      - "docs/qualification/R2C_IMPORT_DIFFERENTIAL.md"
      - "tools/r2c_import_differential.py"
      - "tools/tests/test_r2c_import_differential.py"
      - "tools/stored_state_lookup.py"
      - "tools/tests/test_stored_state_lookup.py"
      - "tools/vanilla_section_extractor.py"
      - "tools/tests/test_vanilla_section_extractor.py"
      - "tools/ci_policy.py"
      - "config/dependency-allowlist.txt"
      - ".cargo/config.toml"
      - "vendor/adler2-2.0.1/**"
      - "vendor/miniz_oxide-0.8.9/**"
      - ".github/workflows/r2c-pregenerated-world-import.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: r2c-pregenerated-world-import-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  import-boundary:
    name: Bounded stored-world import transaction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Dependency policy
        run: python3 tools/ci_policy.py

      - name: Hermetic empty-CARGO_HOME import build
        run: |
          empty_home="$(mktemp -d)"
          CARGO_HOME="$empty_home" cargo check \
            --offline --locked \
            --package helve-world-import \
            --package helve-world-load \
            --all-targets
          CARGO_HOME="$empty_home" cargo test \
            --offline --locked \
            --package helve-world-import \
            --package helve-world-load

      - name: Format import and whole-path harness
        run: |
          cargo fmt --package helve-world-import -- --check
          rustfmt --edition 2024 --check crates/world/helve-world-load/examples/r2c_import_resident_bench.rs

      - name: Check import and load crates
        run: >-
          cargo check
          --package helve-world-import
          --package helve-world-load
          --all-targets
          --locked

      - name: Clippy import and load crates
        run: >-
          cargo clippy
          --package helve-world-import
          --package helve-world-load
          --all-targets
          --locked
          -- -D warnings

      - name: Rust import and resident qualification
        run: >-
          cargo test
          --package helve-world-import
          --package helve-world-load
          --locked

      - name: Whole-path uniform import to resident benchmark smoke
        run: >-
          cargo run
          --release
          --locked
          --package helve-world-load
          --example r2c_import_resident_bench
          -- --smoke

      - name: Generate independent packed benchmark fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools import r2c_import_differential as fixture

          root = Path('/tmp/helve-r2c-packed-benchmark')
          fixture._fixture_regions(root)
          path = root / 'region' / 'r.0.0.mca'
          if not path.is_file():
              raise SystemExit(f'packed benchmark fixture missing: {path}')
          print(path)
          PY

      - name: Whole-path packed import to resident benchmark smoke
        run: >-
          cargo run
          --release
          --locked
          --package helve-world-load
          --example r2c_import_resident_bench
          -- --smoke
          --packed4-region /tmp/helve-r2c-packed-benchmark/region/r.0.0.mca

      - name: Build production-import fact emitter
        run: cargo build --package helve-world-import --bin r2c_import_section_facts --locked

      - name: Differential fixture regressions
        run: python3 -m unittest tools.tests.test_r2c_import_differential -v

      - name: Independent synthetic semantic differential
        run: |
          python3 tools/r2c_import_differential.py \
            --rust-emitter target/debug/r2c_import_section_facts \
            --work-dir /tmp/helve-r2c-import-differential

      - name: Cold stored-state lookup generator regressions
        run: python3 -m unittest tools.tests.test_stored_state_lookup -v

      # This is intentionally independent implementation evidence. The Python extractor uses a
      # transparent generic NBT oracle; production Rust uses a bounded schema cursor. Agreement is
      # checked at all 4096 dense semantic cells per block-bearing section.
      - name: Existing vanilla-save oracle regression
        run: python3 -m unittest tools.tests.test_vanilla_section_extractor -v

      - name: Python syntax
        run: >-
          python3 -m py_compile
          tools/r2c_import_differential.py
          tools/tests/test_r2c_import_differential.py
          tools/stored_state_lookup.py
          tools/tests/test_stored_state_lookup.py
          tools/vanilla_section_extractor.py
          tools/tests/test_vanilla_section_extractor.py
