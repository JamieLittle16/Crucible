name: TEMP Apply packed widen fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'm0/section-full-qualification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: m0/section-full-qualification
          persist-credentials: true

      - name: Apply guarded Rust patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/world/crucible-world-section/src/policy_candidates.rs')
          text = path.read_text()

          old = '''                    let mut widened = storage.widen();
                    debug_assert_eq!(widened.try_replace(cell, state), PackedReplace::Done);
                    self.storage = PackedStorage::Packed(widened);
'''
          new = '''                    let mut widened = storage.widen();
                    match widened.try_replace(cell, state) {
                        PackedReplace::Done => {}
                        PackedReplace::NeedsWider | PackedReplace::NeedsDirect => {
                            unreachable!("widened packed storage must accept pending state")
                        }
                    }
                    self.storage = PackedStorage::Packed(widened);
'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one packed widen side-effect assertion')
          text = text.replace(old, new, 1)

          marker = '''    #[test]
    fn packed_width_tracks_local_capacity() {
'''
          regression = '''    #[test]
    fn packed_first_widen_installs_pending_state_in_all_build_modes() {
        let mut section = PackedLocalBlockSection::filled(AIR, &GeneratedStateFacts);

        assert_eq!(section.replace(pos(16), state(7), &GeneratedStateFacts), AIR);
        assert_eq!(section.replace(pos(16), AIR, &GeneratedStateFacts), state(7));
        assert_eq!(section.replace(pos(33), state(7), &GeneratedStateFacts), AIR);

        assert_eq!(section.representation(), PackedLocalRepresentation::Packed(1));
        assert_eq!(section.replace(pos(37), state(15), &GeneratedStateFacts), AIR);
        assert_eq!(section.get(pos(37)), state(15));
        assert_eq!(section.representation(), PackedLocalRepresentation::Packed(2));
    }

'''
          if regression not in text:
              if text.count(marker) != 1:
                  raise SystemExit('packed regression insertion point not unique')
              text = text.replace(marker, regression + marker, 1)

          path.write_text(text)
          PY

      - name: Format targeted crate
        run: cargo fmt --package crucible-world-section

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world/crucible-world-section/src/policy_candidates.rs
          if git diff --cached --quiet; then
            echo 'patch already applied'
            exit 0
          fi
          git commit -m 'M0.3C: fix packed widening in release builds'
          git push origin HEAD:m0/section-full-qualification
