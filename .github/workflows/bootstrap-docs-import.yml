name: Bootstrap Docs Import

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          ref: bootstrap/docs-import-final
          fetch-depth: 1

      - name: Validate transport fragments
        shell: python3 {0}
        run: |
          from pathlib import Path
          import re

          expected = {
              **{f'part-{i:03d}.b64': 16000 for i in range(11)},
              'part-011.b64': 8000,
              'part-011-b.b64': 8000,
              'part-012.b64': 16000,
              'part-013.b64': 16000,
              'part-014-a.b64': 4000,
              'part-014-b.b64': 4000,
              'part-014-c.b64': 4000,
              'part-014-d.b64': 4000,
              'part-015.b64': 3296,
          }
          root = Path('.bootstrap/docs')
          bad = False
          for name, size in expected.items():
              path = root / name
              if not path.is_file():
                  print(f'MISSING {name}')
                  bad = True
                  continue
              raw = path.read_bytes()
              valid = re.fullmatch(rb'[A-Za-z0-9+/=]*', raw) is not None
              print(f'{name}: bytes={len(raw)} expected={size} alphabet={valid}')
              if len(raw) != size or not valid:
                  bad = True
          extras = sorted(p.name for p in root.glob('*.b64') if p.name not in expected)
          if extras:
              print('EXTRA:', ', '.join(extras))
              bad = True
          if bad:
              raise SystemExit('transport fragment validation failed')

      - name: Reconstruct and verify documentation archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/docs/part-000.b64 \
            .bootstrap/docs/part-001.b64 \
            .bootstrap/docs/part-002.b64 \
            .bootstrap/docs/part-003.b64 \
            .bootstrap/docs/part-004.b64 \
            .bootstrap/docs/part-005.b64 \
            .bootstrap/docs/part-006.b64 \
            .bootstrap/docs/part-007.b64 \
            .bootstrap/docs/part-008.b64 \
            .bootstrap/docs/part-009.b64 \
            .bootstrap/docs/part-010.b64 \
            .bootstrap/docs/part-011.b64 \
            .bootstrap/docs/part-011-b.b64 \
            .bootstrap/docs/part-012.b64 \
            .bootstrap/docs/part-013.b64 \
            .bootstrap/docs/part-014-a.b64 \
            .bootstrap/docs/part-014-b.b64 \
            .bootstrap/docs/part-014-c.b64 \
            .bootstrap/docs/part-014-d.b64 \
            .bootstrap/docs/part-015.b64 \
            | base64 --decode > /tmp/crucible-docs.zip
          echo '3428e2c4f489b9c3741ee41bcdd42e2e75abc9a845b883a0439c6e7a08a01655  /tmp/crucible-docs.zip' | sha256sum --check --strict

      - name: Extract canonical documentation safely
        shell: python3 {0}
        run: |
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path.cwd().resolve()
          archive = Path('/tmp/crucible-docs.zip')
          with ZipFile(archive) as zf:
              files = [info for info in zf.infolist() if not info.is_dir()]
              if len(files) != 144:
                  raise SystemExit(f'expected 144 documentation files, found {len(files)}')
              for info in files:
                  rel = PurePosixPath(info.filename)
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
                  target = (root / Path(*rel.parts)).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'archive path escapes repository: {info.filename}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(info))

          readme = root / 'docs/archive/ARCHITECTURE_BUNDLE_README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace('(docs/CRUCIBLE_MASTER_BLUEPRINT.md)', '(../CRUCIBLE_MASTER_BLUEPRINT.md)')
          text = text.replace('(docs/00-foundation/', '(../00-foundation/')
          text = text.replace('(docs/01-architecture/', '(../01-architecture/')
          text = text.replace('(docs/04-engineering/', '(../04-engineering/')
          text = text.replace('(docs/02-subsystems/world/)', '(../02-subsystems/world/)')
          readme.write_text(text, encoding='utf-8')

      - name: Remove bootstrap transport from staging tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-docs-import.yml

      - name: Commit canonical documentation tree to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'nothing to commit'; exit 1; }
          git commit -m 'docs: establish canonical Crucible architecture corpus'
          git push origin HEAD:bootstrap/docs-import-final
