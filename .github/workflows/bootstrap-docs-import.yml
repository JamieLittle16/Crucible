name: Bootstrap Vanilla Atlas Import

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Atlas staging branch
        uses: actions/checkout@v6
        with:
          ref: m0/vanilla-atlas-work
          fetch-depth: 1

      - name: Verify transport fragments
        shell: python3 {0}
        run: |
          from pathlib import Path
          import hashlib

          expected = {
              'part-00.b64': (7000, '586062a0379c44cb383de32e0f2bd3de0e449ebd0d6d378c7ffdb0596b867e5d'),
              'part-01.b64': (7000, 'd928ee89a787f526ad6cbbd7b4158c2b39fce9276bbab68b762110934f97e3ff'),
              'part-02.b64': (7000, '00627360936614dc13e22dbdd64c17ca6920fae78065732c8208a6e8964153ef'),
              'part-03.b64': (7000, '9542bbba00bcdbb60fd3a23eb4dc1e84651fa3f63665ef456d37ca0d98a6906c'),
              'part-04.b64': (7000, 'dd2c5ddc6c8c478c2878a40f048b61f463e0be67ca3fb61a9a4980f521881494'),
              'part-05.b64': (5632, '99458397ac687c3959fb81b98ad156ef2169e66d9addee70c0694d963db2f962'),
          }
          root = Path('.bootstrap/atlas')
          found = {p.name for p in root.glob('part-*.b64')}
          if found != set(expected):
              raise SystemExit(f'transport fragment set mismatch: {sorted(found)}')
          for name, (size, digest) in expected.items():
              data = (root / name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if len(data) != size or actual != digest:
                  raise SystemExit(f'{name}: size/hash mismatch ({len(data)}, {actual})')
              print(f'{name}: verified')

      - name: Reconstruct and verify Atlas archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/atlas/part-*.b64 > /tmp/atlas.b64
          echo '733efab234e1b1fb3f7900ee5742a49641862dd096a6d66965f7128e2b541de8  /tmp/atlas.b64' | sha256sum --check --strict
          base64 --decode /tmp/atlas.b64 > /tmp/atlas.tar.gz
          echo 'b961da6440077b18621a2f26a1fd4e8c9d96dc373d77b1477dfa6f3a12fabcfe  /tmp/atlas.tar.gz' | sha256sum --check --strict

      - name: Extract Atlas tree safely
        shell: python3 {0}
        run: |
          from pathlib import Path, PurePosixPath
          import tarfile

          root = Path.cwd().resolve()
          with tarfile.open('/tmp/atlas.tar.gz', 'r:gz') as tf:
              members = tf.getmembers()
              for member in members:
                  rel = PurePosixPath(member.name)
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'unsupported archive entry: {member.name}')
                  target = (root / Path(*rel.parts)).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'archive path escapes repository: {member.name}')
              tf.extractall(root, filter='data')

          staged = root / 'tools/xtask-main.rs'
          target = root / 'tools/xtask/src/main.rs'
          target.write_bytes(staged.read_bytes())
          staged.unlink()

      - name: Remove transport and validate tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          python3 -m py_compile tools/vanilla_atlas.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          test ! -e .crucible/vanilla/atlas.sqlite
          test ! -e mc-src.zip

      - name: Commit Atlas implementation to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'nothing to commit'; exit 1; }
          git commit -m 'feat: establish Vanilla Atlas source tracker'
          git push origin HEAD:m0/vanilla-atlas-work
