name: R2C Materialize Compression Vendor

on:
  push:
    branches:
      - r2c/pregenerated-world-compression

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: r2c/pregenerated-world-compression
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Resolve exact reviewed dependency set
        run: |
          cargo +1.97.1 generate-lockfile
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path('Cargo.lock').read_text())
          expected = {
              ('miniz_oxide', '0.8.9'): '1fa76a2c86f704bdb222d66965fb3d63269ce38518b83cb0575fca855ebb6316',
              ('adler2', '2.0.1'): '320119579fcad9c21884f5c4861d16174d0e06250625266f50fe6898340abefa',
          }
          observed = {}
          for package in lock['package']:
              key = (package['name'], package['version'])
              if key in expected:
                  observed[key] = package.get('checksum')
          if observed != expected:
              raise SystemExit(f'exact dependency lock mismatch: {observed!r}')
          print('exact reviewed dependency checksums PASS')
          PY

      - name: Vendor exact dependency set
        run: |
          rm -rf vendor
          mkdir -p .cargo
          cargo +1.97.1 vendor --locked --versioned-dirs vendor > .cargo/config.toml

      - name: Prove empty-CARGO_HOME offline build
        run: |
          empty_home="$(mktemp -d)"
          CARGO_HOME="$empty_home" cargo +1.97.1 check --offline --locked -p helve-world-import
          python3 tools/ci_policy.py

      - name: Commit vendored sources
        run: |
          git add Cargo.lock .cargo/config.toml vendor
          if git diff --cached --quiet; then
            echo "compression vendor already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R2C: materialize reviewed compression vendor"
          git push origin HEAD:r2c/pregenerated-world-compression
