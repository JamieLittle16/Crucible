name: Section Full Qualification

on:
  pull_request:
    paths:
      - crates/qualification/crucible-section-qualification/**
      - crates/world/crucible-world-contract/**
      - crates/world/crucible-world-reference/**
      - crates/world/crucible-world-section/**
      - crates/data/crucible-generated/**
      - tools/xtask/**
      - vanilla/fixtures/section/**
      - .github/workflows/section-full-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  full-section-equivalence:
    name: Full section equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run full multi-seed section qualification
        run: cargo xtask qualify section --full

      - name: Upload full qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: crucible-section-full-equivalence
          path: target/crucible-qualification/section/full.json
          if-no-files-found: error
          retention-days: 30
