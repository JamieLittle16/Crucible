name: Section Full Qualification

on:
  pull_request:
    paths:
      - crates/qualification/crucible-section-qualification/**
      - crates/world/crucible-world-contract/**
      - crates/world/crucible-world-reference/**
      - crates/world/crucible-world-section/**
      - crates/data/crucible-generated/**
      - tools/xtask/**
      - vanilla/state-data/**
      - vanilla/fixtures/section/**
      - .github/workflows/section-full-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Full section qualification (${{ matrix.candidate }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: [direct, adaptive, fast-local, packed-local]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run full multi-seed section qualification
        run: >-
          cargo run --release --locked -p xtask --
          qualify section --full --candidate ${{ matrix.candidate }}

      - name: Upload full qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: crucible-section-full-${{ matrix.candidate }}
          path: target/crucible-qualification/section/full.json
          if-no-files-found: error
          retention-days: 30
