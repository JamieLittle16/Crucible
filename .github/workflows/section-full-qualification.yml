name: Section Full Qualification

on:
  push:
    branches: [main]
    paths:
      - crates/qualification/helve-section-qualification/**
      - crates/world/helve-world-contract/**
      - crates/world/helve-world-reference/**
      - crates/world/helve-world-section/**
      - crates/data/helve-generated/**
      - tools/xtask/**
      - tools/section_correctness_bundle.py
      - vanilla/state-data/**
      - vanilla/fixtures/section/**
      - .github/workflows/section-full-qualification.yml
  pull_request:
    paths:
      - crates/qualification/helve-section-qualification/**
      - crates/world/helve-world-contract/**
      - crates/world/helve-world-reference/**
      - crates/world/helve-world-section/**
      - crates/data/helve-generated/**
      - tools/xtask/**
      - tools/section_correctness_bundle.py
      - vanilla/state-data/**
      - vanilla/fixtures/section/**
      - .github/workflows/section-full-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Full section qualification (${{ matrix.candidate }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: [direct, adaptive, fast-local, packed-local]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      # Full qualification preserves per-mutation candidate/reference semantic checks and
      # performs complete 4096-cell + fresh-summary recomputation at deterministic barriers.
      - name: Run full multi-seed section qualification
        run: >-
          cargo run --release --locked -p xtask --
          qualify section --full --candidate ${{ matrix.candidate }}

      - name: Upload full qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helve-section-full-${{ matrix.candidate }}
          path: target/helve-qualification/section/full.json
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Validated full correctness bundle
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      # Re-run the four already-green matrix candidates in one checkout so the final handoff is
      # provably same-commit and does not depend on cross-job artifact association.
      - name: Regenerate same-checkout full evidence
        shell: bash
        run: |
          set -euo pipefail
          root=target/helve-qualification/section/full-bundle
          for candidate in direct adaptive fast-local packed-local; do
            cargo run --release --locked -p xtask -- \
              qualify section --full --candidate "$candidate"
            mkdir -p "$root/$candidate"
            cp target/helve-qualification/section/full.json "$root/$candidate/full.json"
          done

      - name: Validate and seal correctness bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/section_correctness_bundle.py \
            --repo-root . \
            --input-root target/helve-qualification/section/full-bundle \
            --expected-commit "$(git rev-parse HEAD)" \
            --output target/helve-qualification/section/full-bundle/bundle-manifest.json

      - name: Upload validated correctness bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helve-section-full-bundle
          path: target/helve-qualification/section/full-bundle
          if-no-files-found: error
          retention-days: 30
