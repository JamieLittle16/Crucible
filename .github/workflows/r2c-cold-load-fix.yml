name: R2C Cold Load One-shot Fix

on:
  push:
    branches: [r2c/cold-load-evidence]
    paths:
      - "tools/r2c_cold_load_fix.py"
      - ".github/workflows/r2c-cold-load-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Apply deterministic cleanup
        run: |
          python3 tools/r2c_cold_load_fix.py
          cargo fmt --package helve-cold-load-qualification
      - name: Commit cleanup
        run: |
          git diff --check
          if git diff --quiet; then
            echo "expected cleanup diff was empty" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/qualification/helve-cold-load-qualification/src/lib.rs \
                  crates/qualification/helve-cold-load-qualification/src/bin/cold_load_bench.rs
          git commit -m "R2C: clean cold load qualification"
          git push origin HEAD:r2c/cold-load-evidence
