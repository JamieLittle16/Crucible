name: CLA Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  cla:
    name: Contributor licence agreement
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require affirmative CLA acceptance
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os
          import re

          author = os.environ.get("PR_AUTHOR", "")
          body = os.environ.get("PR_BODY", "")

          # The project steward and repository automation are not third-party
          # contributors and do not need to accept their own CLA through a PR.
          exempt = {"JamieLittle16", "dependabot[bot]", "github-actions[bot]"}
          if author in exempt:
              print(f"CLA gate: exempt repository identity {author}")
              raise SystemExit(0)

          pattern = re.compile(
              r"^-\s*\[[xX]\]\s*\*\*I have read and agree to the Helve "
              r"Contributor Licence Agreement\.\*\*",
              re.MULTILINE,
          )
          if not pattern.search(body):
              print(
                  "External contributions require affirmative acceptance of CLA.md.\n"
                  "Check the CLA acceptance box in the pull request template after "
                  "reading the agreement, then update the pull request."
              )
              raise SystemExit(1)

          print(f"CLA gate: affirmative acceptance recorded for {author}")
          PY
