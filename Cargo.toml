[workspace]
resolver = "3"
members = [
    "crates/helve-types",
    "crates/helve-component",
    "crates/helve-composition",
    "crates/helve-server",
    "crates/data/helve-generated",
    "crates/network/helve-connection-core",
    "crates/network/helve-connection-driver",
    "crates/network/helve-publication-core",
    "crates/network/helve-packet-core",
    "crates/network/helve-preplay-core",
    "crates/network/helve-preplay-io",
    "crates/network/helve-protocol-core",
    "crates/network/helve-session-core",
    "crates/network/helve-target-26-2",
    "crates/qualification/helve-benchmark-support",
    "crates/qualification/helve-client-spine-qualification",
    "crates/qualification/helve-composition-qualification",
    "crates/qualification/helve-executor-baseline",
    "crates/qualification/helve-ownership-qualification",
    "crates/qualification/helve-r2c-cold-path-qualification",
    "crates/qualification/helve-section-qualification",
    "crates/qualification/helve-world-access-qualification",
    "crates/world/helve-world-chunk",
    "crates/world/helve-world-contract",
    "crates/world/helve-world-import",
    "crates/world/helve-world-load",
    "crates/world/helve-world-reference",
    "crates/world/helve-world-runtime",
    "crates/world/helve-world-section",
    "tools/xtask",
]
default-members = [
    "crates/helve-types",
    "crates/helve-component",
    "crates/helve-composition",
    "crates/helve-server",
    "crates/data/helve-generated",
    "crates/network/helve-connection-core",
    "crates/network/helve-connection-driver",
    "crates/network/helve-publication-core",
    "crates/network/helve-packet-core",
    "crates/network/helve-preplay-core",
    "crates/network/helve-preplay-io",
    "crates/network/helve-protocol-core",
    "crates/network/helve-session-core",
    "crates/network/helve-target-26-2",
    "crates/qualification/helve-benchmark-support",
    "crates/qualification/helve-client-spine-qualification",
    "crates/qualification/helve-composition-qualification",
    "crates/qualification/helve-executor-baseline",
    "crates/qualification/helve-ownership-qualification",
    "crates/qualification/helve-r2c-cold-path-qualification",
    "crates/qualification/helve-section-qualification",
    "crates/qualification/helve-world-access-qualification",
    "crates/world/helve-world-chunk",
    "crates/world/helve-world-contract",
    "crates/world/helve-world-import",
    "crates/world/helve-world-load",
    "crates/world/helve-world-reference",
    "crates/world/helve-world-runtime",
    "crates/world/helve-world-section",
    "tools/xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/JamieLittle16/Helve"
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
debug = 1
