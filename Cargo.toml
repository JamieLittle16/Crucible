[workspace]
resolver = "3"
members = [
    "crates/crucible-types",
    "crates/crucible-component",
    "crates/crucible-composition",
    "crates/data/crucible-generated",
    "crates/network/crucible-protocol-core",
    "crates/qualification/crucible-benchmark-support",
    "crates/qualification/crucible-ownership-qualification",
    "crates/qualification/crucible-section-qualification",
    "crates/qualification/crucible-world-access-qualification",
    "crates/world/crucible-world-chunk",
    "crates/world/crucible-world-contract",
    "crates/world/crucible-world-reference",
    "crates/world/crucible-world-section",
    "tools/xtask",
]
default-members = [
    "crates/crucible-types",
    "crates/crucible-component",
    "crates/crucible-composition",
    "crates/data/crucible-generated",
    "crates/network/crucible-protocol-core",
    "crates/qualification/crucible-benchmark-support",
    "crates/qualification/crucible-ownership-qualification",
    "crates/qualification/crucible-section-qualification",
    "crates/qualification/crucible-world-access-qualification",
    "crates/world/crucible-world-chunk",
    "crates/world/crucible-world-contract",
    "crates/world/crucible-world-reference",
    "crates/world/crucible-world-section",
    "tools/xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/JamieLittle16/Crucible"
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
debug = 1
